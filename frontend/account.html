<!-- Profile interface for the HARASS evaluation service. -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>حسابي — HARASS</title>
    <link rel="stylesheet" href="assets/css/styles.css?v=47">
    <script src="assets/js/core/ui.js?v=47" defer></script>
    <script src="assets/js/core/api-client.js?v=47" defer></script>
    <script src="assets/js/core/forms.js?v=47" defer></script>
    <script src="assets/js/pages/account.js?v=47" defer></script>
    <script src="assets/js/core/bootstrap.js?v=47" defer></script>
  </head>
  <body data-page="account">
    <a class="skip-link" href="#main">انتقل إلى المحتوى</a>
    <div class="page">
      <header data-shell-header></header>
      <main class="main" id="main">
        <div class="container">
          <div
            id="pageError"
            class="alert alert-error"
            role="alert"
            tabindex="-1"
            hidden
          ></div>
          <div class="account-page">
            <section class="card profile-card" aria-labelledby="profileName">
              <span class="avatar avatar-large" data-user-initial aria-hidden="true"></span>
              <div class="profile-details">
                <div class="profile-name">
                  <h1 id="profileName" data-user-name>حسابي</h1>
                  <button id="editName" type="button" class="btn btn-sm">تعديل الاسم</button>
                </div>
                <form id="nameForm" class="name-form" hidden>
                  <label for="fullName">الاسم</label>
                  <input id="fullName" type="text" required minlength="2" maxlength="100" autocomplete="name">
                  <div class="row-actions">
                    <button type="submit" class="btn btn-primary btn-sm">حفظ</button>
                    <button id="cancelName" type="button" class="btn btn-sm">إلغاء</button>
                  </div>
                </form>
                <p id="profileEmail" class="profile-email"></p>
                <div id="profileBadges" class="chip-row"></div>
                <p id="profileSince" class="hint"></p>
              </div>
              <button id="sendVerification" type="button" class="btn" hidden>إرسال رابط التحقق</button>
            </section>
            <section class="card" aria-labelledby="activityTitle">
              <h2 id="activityTitle">نشاطك</h2>
              <div id="activity" class="overview-strip" aria-live="polite"></div>
            </section>
            <section class="card" aria-labelledby="sessionsTitle">
              <h2 id="sessionsTitle">الجلسات النشطة</h2>
              <div id="sessions" aria-live="polite">جارٍ تحميل الجلسات…</div>
              <button id="logoutAll" type="button" class="btn btn-danger">
                تسجيل الخروج من جميع الجلسات
              </button>
            </section>
          </div>
        </div>
      </main>
      <footer class="app-footer" data-shell-footer></footer>
    </div>
  </body>
</html>
