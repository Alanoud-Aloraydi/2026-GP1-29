<!-- Account security interface for the HARASS evaluation service. -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>أمان الحساب — HARASS</title>
    <link rel="stylesheet" href="assets/css/styles.css?v=11">
    <script src="assets/js/core/ui.js?v=11" defer></script>
    <script src="assets/js/core/api-client.js?v=11" defer></script>
    <script src="assets/js/core/forms.js?v=11" defer></script>
    <script src="assets/js/pages/account.js?v=11" defer></script>
    <script src="assets/js/core/bootstrap.js?v=11" defer></script>
  </head>
  <body data-page="account">
    <a class="skip-link" href="#main">انتقل إلى المحتوى</a>
    <div class="page">
      <header data-shell-header></header>
      <main class="main" id="main">
        <div class="container form-container">
          <div class="page-head"><h1>أمان الحساب</h1></div>
          <div
            id="pageError"
            class="alert alert-error"
            role="alert"
            tabindex="-1"
            hidden
          ></div>
          <form id="passwordForm" class="form-panel">
            <h2>تغيير كلمة المرور</h2>
            <div class="form-group">
              <label for="currentPassword">كلمة المرور الحالية</label>
              <input
                id="currentPassword"
                type="password"
                required
                maxlength="128"
                autocomplete="current-password">
            </div>
            <div class="form-group">
              <label for="newPassword">كلمة المرور الجديدة</label>
              <input
                id="newPassword"
                type="password"
                required
                minlength="15"
                maxlength="128"
                autocomplete="new-password">
            </div>
            <div class="form-group">
              <label for="confirmPassword">تأكيد كلمة المرور الجديدة</label>
              <input
                id="confirmPassword"
                type="password"
                required
                maxlength="128"
                autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary">
              حفظ كلمة المرور
            </button>
            <p id="passwordResult" role="status"></p>
          </form>
          <section id="emailVerification" class="mt-4" hidden aria-labelledby="emailTitle">
            <h2 id="emailTitle">البريد الإلكتروني</h2>
            <p id="emailStatus" role="status"></p>
            <button id="sendVerification" type="button" class="btn" hidden>إرسال رابط التحقق</button>
          </section>
          <section class="mt-4" aria-labelledby="sessionsTitle">
            <h2 id="sessionsTitle">الجلسات النشطة</h2>
            <div id="sessions" aria-live="polite">جارٍ تحميل الجلسات…</div>
            <button id="logoutAll" type="button" class="btn">
              تسجيل الخروج من جميع الجلسات
            </button>
          </section>
        </div>
      </main>
      <footer class="app-footer" data-shell-footer></footer>
    </div>
  </body>
</html>
