<!-- Connections interface for the HARASS evaluation service. -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>اتصالات النماذج — HARASS</title>
    <link rel="stylesheet" href="assets/css/styles.css?v=11">
    <script src="assets/js/core/ui.js?v=11" defer></script>
    <script src="assets/js/core/api-client.js?v=11" defer></script>
    <script src="assets/js/core/forms.js?v=11" defer></script>
    <script src="assets/js/pages/connections.js?v=11" defer></script>
    <script src="assets/js/core/bootstrap.js?v=11" defer></script>
  </head>
  <body data-page="connections">
    <a class="skip-link" href="#main">انتقل إلى المحتوى</a>
    <div class="page">
      <header data-shell-header></header>
      <main class="main" id="main">
        <div class="container">
          <div class="page-head">
            <h1>اتصالات النماذج</h1>
            <p>احفظ الاتصال واختبره قبل بدء تقييم السلامة.</p>
          </div>
          <div
            id="pageError"
            class="alert alert-error"
            role="alert"
            tabindex="-1"
            hidden
          ></div>
          <div class="section-toolbar">
            <a class="btn btn-primary" href="model-configuration.html"
              >إضافة اتصال</a
            >
          </div>
          <section id="connections" aria-live="polite">
            <p>جارٍ تحميل الاتصالات…</p>
          </section>
          <p class="hint mt-4">
            اختبار الاتصال يتحقق من الوصول إلى النموذج. لا يمثل نتيجة تقييم
            سلامة.
          </p>
        </div>
      </main>
      <footer class="app-footer" data-shell-footer></footer>
    </div>
  </body>
</html>
