<!-- One baseline model: its report and, in release two, testing it directly. -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>تقرير النموذج — HARASS</title>
    <link rel="stylesheet" href="assets/css/styles.css?v=63">
    <script type="module" src="assets/js/pages/model.js?v=63"></script>
  </head>
  <body data-page="model">
    <a class="skip-link" href="#main">انتقل إلى المحتوى</a>
    <div class="page">
      <header data-shell-header></header>
      <main class="main" id="main">
        <div class="container">
          <div class="page-head">
            <a href="models.html">النماذج الأساسية</a>
            <h1><bdi id="modelTitle">تقرير النموذج</bdi></h1>
          </div>
          <div id="pageError" class="alert" role="alert" tabindex="-1" hidden></div>
          <section id="modelMissing" hidden></section>
          <div id="modelTabs" hidden>
            <div class="tabs" role="tablist" aria-label="أقسام النموذج">
              <button class="tab" id="reportTab" type="button" role="tab" aria-selected="true" aria-controls="reportPanel">التقرير</button>
              <button class="tab" id="testTab" type="button" role="tab" aria-selected="false" aria-controls="testPanel" tabindex="-1">اختبر هذا النموذج</button>
            </div>
            <section class="tab-panel" id="reportPanel" role="tabpanel" aria-labelledby="reportTab" tabindex="0"></section>
            <section class="tab-panel" id="testPanel" role="tabpanel" aria-labelledby="testTab" tabindex="0" hidden></section>
          </div>
        </div>
      </main>
      <footer class="app-footer" data-shell-footer></footer>
    </div>
  </body>
</html>
