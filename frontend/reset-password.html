<!-- Feature-gated account action using a single-use email link. -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>كلمة مرور جديدة — HARASS</title>
    <link rel="stylesheet" href="assets/css/styles.css?v=11">
    <script src="assets/js/core/ui.js?v=11" defer></script>
    <script src="assets/js/core/api-client.js?v=11" defer></script>
    <script src="assets/js/core/forms.js?v=11" defer></script>
    <script src="assets/js/pages/account-email.js?v=11" defer></script>
    <script src="assets/js/core/bootstrap.js?v=11" defer></script>
  </head>
  <body data-page="reset-password">
    <a class="skip-link" href="#main">انتقل إلى المحتوى</a>
    <div class="page">
      <header data-shell-header></header>
      <main class="main" id="main">
        <div class="container form-container">
          <div class="page-head"><h1>كلمة مرور جديدة</h1><p>اختر عبارة بين 15 و128 حرفًا.</p></div>
          <div id="pageError" class="alert alert-error" role="alert" tabindex="-1" hidden></div>
          <form id="accountActionForm" class="form-panel" hidden><div class="form-group"><label for="newPassword">كلمة المرور الجديدة</label><input id="newPassword" name="newPassword" type="password" required minlength="15" maxlength="128" autocomplete="new-password"></div><div class="form-group"><label for="confirmPassword">تأكيد كلمة المرور</label><input id="confirmPassword" name="confirmPassword" type="password" required minlength="15" maxlength="128" autocomplete="new-password"></div><button type="submit" class="btn btn-primary">حفظ كلمة المرور</button></form>
          <p id="actionResult" role="status"></p>
          <p class="mt-4"><a href="login.html">تسجيل الدخول</a></p>
        </div>
      </main>
      <footer class="app-footer" data-shell-footer></footer>
    </div>
  </body>
</html>
