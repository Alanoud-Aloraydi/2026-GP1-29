# Quality gate for every push and pull request: the backend, the frontend
# and the container setup are checked in separate jobs, so a failure names
# the part of the project that broke.
name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "22"
  PNPM_VERSION: "11.25.0"

jobs:
  backend-quality:
    name: Backend · format, lint, types and layers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install the backend with its development tools
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"
      - name: Formatting (ruff format)
        run: ruff format --check src tests
      - name: Lint rules (ruff check)
        run: ruff check src tests
      - name: Static types (mypy, strict)
        run: mypy src tests
      - name: Architecture layers (import-linter)
        run: lint-imports

  backend-tests:
    name: Backend · tests on SQLite and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: harass_test
          POSTGRES_USER: harass_test
          POSTGRES_PASSWORD: isolated-test-password
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U harass_test -d harass_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      HARASS_TEST_DATABASE_URL: postgresql+psycopg://harass_test:isolated-test-password@localhost:55433/harass_test
    steps:
      - name: Check out the code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install the backend with its development tools
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"
      # Every store test runs twice, on SQLite and on this PostgreSQL, so
      # no test may be skipped for a missing database here.
      - name: Unit, API and storage tests
        run: python -m pytest -q --tb=short -rs

  frontend:
    name: Frontend · JavaScript, HTML and CSS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: JavaScript syntax (node --check)
        run: find frontend/assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Behaviour tests in a simulated browser (tests/frontend)
        run: |
          for test in tests/frontend/*.cjs; do
            echo "::group::$test"
            node "$test" frontend/assets/js
            echo "::endgroup::"
          done
      - name: Install the frontend quality tools
        run: pnpm --dir frontend install --frozen-lockfile --ignore-scripts
      - name: Style and markup (semistandard, html-validate, stylelint)
        run: pnpm --dir frontend run check

  containers:
    name: Containers · Dockerfile, Compose and workflow files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Placeholder values only satisfy the required-variable checks of
    # compose.yml; nothing here starts the services.
    env:
      HARASS_POSTGRES_PASSWORD: ci-placeholder
      HARASS_POSTGRES_ADMIN_PASSWORD: ci-placeholder
      HARASS_ENCRYPTION_KEY: ci-placeholder
      HARASS_JWT_SECRET: ci-placeholder
      HARASS_JUDGE_SERVER_URL: http://judge.invalid:8083
    steps:
      - name: Check out the code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Workflow files (actionlint)
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Dockerfile rules (docker build --check)
        run: docker build --check .
      - name: Compose files are valid
        run: |
          docker compose -f compose.yml config -q
          docker compose -f compose.test.yml config -q
      - name: Application image builds
        run: docker build --tag harass:ci .
