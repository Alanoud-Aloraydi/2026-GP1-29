# Python, frontend and PostgreSQL contract checks for every proposed revision.
name: CI
on:
  pull_request:
  push:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: harass_test
          POSTGRES_USER: harass_test
          POSTGRES_PASSWORD: isolated-test-password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U harass_test -d harass_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      HARASS_TEST_DATABASE_URL: postgresql+psycopg://harass_test:isolated-test-password@localhost:5433/harass_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check src tests
      - run: ruff check src tests
      - run: mypy src tests
      - run: lint-imports
      - run: python -m pytest -q --tb=short
      - name: Check frontend syntax
        run: |
          find frontend/assets/js -name '*.js' -exec node --check {} \;
      - run: npx --yes semistandard@17.0.0 --env browser "frontend/assets/js/**/*.js" "frontend/*.cjs"
      - run: npx --yes html-validate@10.2.1 --config frontend/htmlvalidate.config.cjs "frontend/*.html"
      - run: npx --yes stylelint@16.24.0 --config frontend/stylelint.config.cjs "frontend/assets/css/*.css"
