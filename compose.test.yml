# Disposable PostgreSQL instance for isolated integration tests.
name: harass-tests
services:
  postgres-test:
    image: postgres:18
    environment:
      POSTGRES_DB: harass_test
      POSTGRES_USER: harass_test
      POSTGRES_PASSWORD: isolated-test-password
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harass_test -d harass_test"]
      interval: 2s
      timeout: 3s
      retries: 30
